<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyLife">
  <meta name="description" content="Planning d'équipe et séances de sport dans une seule application.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>MyLife · Travail & Sport</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#151b30;--panel2:#1d2540;--line:#303953;--text:#f4f6ff;--muted:#a6b1cb;--purple:#9178ff;--cyan:#2fd7ce;--orange:#ffba72;--blue:#6bb7ff;--rose:#ff86ac;--green:#68dba5;--shadow:0 18px 45px rgba(1,2,15,.22)}
    *{box-sizing:border-box}html{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top left,#222344 0,transparent 35%),var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
    .app{max-width:630px;margin:0 auto;padding:0 18px 105px;min-height:100dvh}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 2px 24px}.logo{display:flex;align-items:center;gap:12px}.logo-mark{background:linear-gradient(140deg,#9878ff,#4a68da);width:47px;height:47px;border-radius:16px;display:grid;place-items:center;font-size:23px;box-shadow:0 8px 20px #5344bb55}.logo h1{font-size:22px;letter-spacing:-.7px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}.chip{border:1px solid var(--line);background:#1d2440;color:var(--muted);border-radius:100px;padding:8px 11px;font-size:12px;white-space:nowrap}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:24px 0 12px}.section-head h2,.page-title{margin:0;letter-spacing:-.5px}.page-title{font-size:26px}.section-head h2{font-size:17px}.tiny{font-size:12px;color:var(--muted)}.card{background:linear-gradient(160deg,#1a2038,#131a2e);border:1px solid #303953;border-radius:22px;padding:18px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#443b87 0%,#232553 53%,#16233c 100%);border:1px solid #6258a8;position:relative;overflow:hidden;min-height:158px}.hero:after{content:'✦';position:absolute;font-size:160px;opacity:.1;right:3px;top:-37px;transform:rotate(20deg);pointer-events:none}.eyebrow{color:#d5ceff;text-transform:uppercase;font-weight:800;font-size:11px;letter-spacing:1.35px}.hero-title{font-size:25px;line-height:1.2;font-weight:800;margin:12px 0 8px;position:relative;z-index:1}.hero-desc{font-size:13px;line-height:1.5;color:#d4d9f3;max-width:85%;position:relative;z-index:1}.button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 13px;border-radius:13px;font-weight:700;font-size:13px}.button.primary{background:linear-gradient(125deg,#8f75fb,#6659df);border-color:transparent;color:white}.button.secondary{background:#252c49}.button.ghost{background:transparent}.button.danger{color:#ffb7c5;border-color:#82485b;background:#452536}.button.small{font-size:12px;padding:8px 11px}.button:disabled{opacity:.5;cursor:not-allowed}.btnline{display:flex;gap:9px;flex-wrap:wrap}.full{width:100%}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.stat{padding:15px 10px;border-radius:18px;background:#161e34;border:1px solid var(--line);min-width:0}.stat strong{font-size:24px;display:block;letter-spacing:-1px}.stat small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.35}.tilelist{display:grid;gap:9px}.tile{border:1px solid var(--line);background:#171e33;border-radius:17px;padding:12px;display:flex;align-items:center;gap:12px}.square{height:42px;width:42px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:18px;background:#252d46}.tilemain{flex:1;min-width:0}.tiletitle{font-size:14px;font-weight:750;line-height:1.4}.tilemeta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}.tag{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}.tag.M{background:#334c72;color:#a1ceff}.tag.A{background:#5a3f37;color:#ffd09b}.tag.N{background:#473c75;color:#c5b6ff}.tag.R{background:#245047;color:#8aefd0}.tag.S{background:#373852;color:#c3c9e6}.muted{color:var(--muted)}.empty{padding:22px;text-align:center;border:1px dashed #425070;border-radius:18px;color:var(--muted);font-size:13px;line-height:1.7}.quickactions{display:flex;gap:9px;margin:16px 0 4px}.quickactions .button{flex:1}.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0}.cal-head strong{font-size:18px;text-transform:capitalize}.cal-head .navgroup{display:flex;gap:7px}.round{height:35px;width:35px;padding:0;border-radius:12px;background:#242d49;border:1px solid var(--line);color:white;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:7px 0}.day{min-width:0;height:70px;border:1px solid #29334d;background:#171e33;border-radius:12px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--text)}.day.out{opacity:.27}.day.today{border-color:var(--cyan)}.day.selected{background:#32315f;border-color:var(--purple)}.day span:first-child{font-size:12px;font-weight:750}.day .dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;max-width:100%}.dot{display:block;width:7px;height:7px;border-radius:50%;background:#6e7a95}.dot.M{background:var(--blue)}.dot.A{background:var(--orange)}.dot.N{background:var(--purple)}.dot.R{background:var(--green)}.dot.workout{background:var(--rose)}.day .mini{font-size:9px;color:var(--muted)}.legend{display:flex;flex-wrap:wrap;gap:12px;margin:13px 0;color:var(--muted);font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.detail-card{margin-top:12px}.detail-card h3{margin:0 0 12px;font-size:16px;text-transform:capitalize}.detail-row{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.detail-row:first-of-type{border-top:0}.detail-row .button{flex:none}.field{display:grid;gap:7px;margin:12px 0}.field label{color:#d8e0f9;font-size:12px;font-weight:700}.field input,.field select,.field textarea{background:#11182b;color:white;border:1px solid #405071;border-radius:12px;width:100%;padding:12px;min-height:44px}.field textarea{resize:vertical}.field input[type=checkbox]{width:auto;min-height:auto}.field input::placeholder,.field textarea::placeholder{color:#8f9cb7}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{font-size:12px;line-height:1.6;background:#252441;border:1px solid #4d496b;border-radius:15px;padding:12px;color:#d9d8ee}.note-green{background:#15382f;border-color:#315c52;color:#b9efdf}.workout-card{margin-bottom:10px}.workout-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.workout-name{font-weight:800;font-size:15px}.workout-notes{font-size:12px;color:var(--muted);white-space:pre-wrap;line-height:1.5;margin-top:8px}.checks{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.checks input{accent-color:var(--green);height:18px;width:18px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:12;background:rgba(13,17,32,.96);backdrop-filter:blur(14px);border-top:1px solid #323a55;padding:9px max(14px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;justify-content:center}.nav-inner{max-width:610px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav-btn{background:none;border:0;border-radius:13px;color:#919db8;padding:8px 3px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:750}.nav-btn b{font-size:21px;font-weight:500}.nav-btn.active{background:#2f2d58;color:#dacfff}.modal{border:1px solid #485170;background:#151c31;color:white;padding:0;max-width:min(94vw,520px);width:100%;border-radius:23px;max-height:88dvh;box-shadow:0 30px 80px #050916}.modal::backdrop{background:#030716bd;backdrop-filter:blur(3px)}.modal-box{padding:19px;max-height:86dvh;overflow:auto}.modal-top{display:flex;align-items:center;justify-content:space-between}.modal h2{margin:0;font-size:20px}.modal .close{font-size:23px;border:0;background:transparent;color:#c5cce0;padding:5px 8px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions .button{flex:1}.helper{font-size:11px;line-height:1.5;color:var(--muted)}.tabhead{margin-bottom:8px}.chipgroup{display:flex;flex-wrap:wrap;gap:7px}.status{margin:12px 0;color:var(--green);font-size:12px;min-height:0}.settings-list{display:grid;gap:13px}.settings-list .card h3{margin:0 0 8px;font-size:16px}.settings-list .card p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 14px}.footer{font-size:11px;text-align:center;color:var(--muted);margin-top:20px;line-height:1.5}@media(max-width:350px){.app{padding-left:12px;padding-right:12px}.day{height:62px}.tile{padding:9px}.stat{padding:12px 5px}.stat strong{font-size:20px}}
  </style>
</head>
<body>
<div id="app" class="app"></div>
<nav class="bottom-nav" aria-label="Navigation principale"><div class="nav-inner" id="navbar"></div></nav>
<dialog id="dialog" class="modal"><div class="modal-box" id="dialog-content"></div></dialog>
<script>
(() => {
  'use strict';
  const KEY='mylife-data-v1';
  const TYPES={M:{name:'Matin',start:'06:00',end:'14:00',emoji:'🌅'},A:{name:'Après-midi',start:'14:00',end:'22:00',emoji:'🌇'},N:{name:'Nuit',start:'22:00',end:'06:00',emoji:'🌙'},R:{name:'Repos',start:'',end:'',emoji:'🌿'},P:{name:'Personnalisé',start:'09:00',end:'17:00',emoji:'🗓️'}};
  const defaults=()=>({version:1,shifts:{},workouts:[]});
  let data;
  try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');data=validData(raw)?raw:defaults();}catch(e){data=defaults();}
  const today=new Date();today.setHours(12,0,0,0);
  const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parseDate=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
  const offsetDate=(d,offset)=>{const a=new Date(d);a.setDate(a.getDate()+offset);return a};
  const keyToday=dateKey(today);
  const prettyDate=(s,style='full')=>new Intl.DateTimeFormat('fr-FR',style==='full'?{weekday:'long',day:'numeric',month:'long'}:{day:'numeric',month:'short'}).format(parseDate(s));
  const monthName=d=>new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(d);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const validData=v=>v&&v.version===1&&v.shifts&&typeof v.shifts==='object'&&!Array.isArray(v.shifts)&&Array.isArray(v.workouts);
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){alert('Impossible de sauvegarder sur cet appareil. Vérifie le stockage du navigateur.');}};
  const shiftHours=s=>{if(!s||s.type==='R'||!s.start||!s.end)return 0;const [h1,m1]=s.start.split(':').map(Number),[h2,m2]=s.end.split(':').map(Number);let delta=h2*60+m2-h1*60-m1;if(delta<=0)delta+=24*60;return delta/60};
  let page='home',selected=keyToday,month=new Date(today.getFullYear(),today.getMonth(),1);
  const workoutsFor=date=>data.workouts.filter(w=>w.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const shiftLabel=s=>s?`${TYPES[s.type]?.name||'Équipe'}${s.type==='R'?'':` · ${s.start}–${s.end}`}`:'Non renseigné';
  const typeTag=s=>`<span class="tag ${esc(s?.type||'S')}">${esc(s?TYPES[s.type]?.name||'Service':'Libre')}</span>`;
  const empty=message=>`<div class="empty">${message}</div>`;
  const action=(name,label,cls='',other='')=>`<button type="button" class="button ${cls}" data-action="${name}" ${other}>${label}</button>`;
  function renderNav(){document.getElementById('navbar').innerHTML=[['home','⌂','Accueil'],['planning','▦','Planning'],['sport','◉','Sport'],['settings','⚙','Réglages']].map(([id,ic,label])=>`<button class="nav-btn ${page===id?'active':''}" data-action="nav" data-page="${id}" aria-label="${label}" ${page===id?'aria-current="page"':''}><b aria-hidden="true">${ic}</b>${label}</button>`).join('');}
  function shell(content){document.getElementById('app').innerHTML=`<header class="topbar"><div class="logo"><div class="logo-mark" aria-hidden="true">✦</div><div><h1>MyLife</h1><div class="sub">Travail · Sport · Équilibre</div></div></div><span class="chip">${new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'}).format(today)}</span></header><main>${content}</main><div class="footer">MyLife v1.0 · Données enregistrées sur cet appareil</div>`;renderNav()}
  function renderHome(){
    const monthPrefix=keyToday.slice(0,7);
    const shifts=Object.entries(data.shifts).filter(([d,s])=>d.startsWith(monthPrefix)&&s.type!=='R');
    const total=shifts.reduce((v,[,s])=>v+shiftHours(s),0);
    const completed=data.workouts.filter(w=>w.date.startsWith(monthPrefix)&&w.done).length;
    const upcoming=[];for(let i=0;i<7;i++){let d=dateKey(offsetDate(today,i)),s=data.shifts[d],ws=workoutsFor(d);if(s||ws.length)upcoming.push({d,s,ws});}
    const s=data.shifts[keyToday];
    shell(`<div class="hero card"><div class="eyebrow">Ton tableau de bord</div><div class="hero-title">Organise tes journées,<br>garde ton rythme.</div><div class="hero-desc">Tes équipes, tes repos et tes entraînements réunis au même endroit.</div></div>
      <div class="stats"><div class="stat"><strong>${Number.isInteger(total)?total:total.toFixed(1)} h</strong><small>Travail ce mois</small></div><div class="stat"><strong>${shifts.length}</strong><small>Jours travaillés</small></div><div class="stat"><strong>${completed}</strong><small>Séances terminées</small></div></div>
      <div class="section-head"><h2>Aujourd'hui</h2><span class="tiny">${esc(prettyDate(keyToday))}</span></div>
      <div class="tilelist"><div class="tile"><div class="square">${s?TYPES[s.type]?.emoji||'🗓️':'💼'}</div><div class="tilemain"><div class="tiletitle">${esc(shiftLabel(s))}</div><div class="tilemeta">Ton planning de travail</div></div>${typeTag(s)}</div>${workoutsFor(keyToday).map(w=>workoutTile(w)).join('')}</div>
      <div class="quickactions">${action('shift-add','+ Ajouter un service','primary')}${action('sport-add','+ Ajouter un sport','secondary')}</div>
      <div class="section-head"><h2>Les 7 prochains jours</h2>${action('nav','Voir le calendrier','small ghost','data-page="planning"')}</div>
      ${upcoming.length?`<div class="tilelist">${upcoming.map(({d,s,ws})=>`<div class="tile"><div class="square">${esc(new Intl.DateTimeFormat('fr-FR',{day:'numeric'}).format(parseDate(d)))}</div><div class="tilemain"><div class="tiletitle">${esc(prettyDate(d))}</div><div class="tilemeta">${esc(s?shiftLabel(s):'—')} ${ws.length?' · '+ws.length+' séance(s)':''}</div></div>${s?typeTag(s):''}</div>`).join('')}</div>`:empty('Ton planning est vide pour l’instant. Ajoute une équipe ou utilise la rotation automatique.')}
    `);
  }
  function workoutTile(w){return `<div class="tile"><div class="square">${w.done?'✅':'🏋️'}</div><div class="tilemain"><div class="tiletitle">${esc(w.title)}</div><div class="tilemeta">${esc(w.time||'Heure libre')} · ${Number(w.duration)||0} min · ${esc(w.kind)}</div></div>${w.done?'<span class="tag R">Fait</span>':'<span class="tag S">À faire</span>'}</div>`}
  function renderCalendar(){
    const first=new Date(month.getFullYear(),month.getMonth(),1),start=(first.getDay()+6)%7,days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
    let cells=['L','M','M','J','V','S','D'].map(x=>`<div class="dow">${x}</div>`).join('');
    for(let i=0;i<Math.ceil((start+days)/7)*7;i++){
      const d=offsetDate(first,i-start),k=dateKey(d),same=d.getMonth()===month.getMonth(),s=data.shifts[k],ws=workoutsFor(k);
      cells+=`<button type="button" class="day ${same?'':'out'} ${k===keyToday?'today':''} ${k===selected?'selected':''}" data-action="day" data-date="${k}" aria-label="${esc(prettyDate(k))}, ${esc(shiftLabel(s))}, ${ws.length} séance(s)"><span>${d.getDate()}</span><span class="dots">${s?`<i class="dot ${esc(s.type)}"></i>`:''}${ws.length?'<i class="dot workout"></i>':''}</span>${s?`<span class="mini">${esc(s.type==='P'?'Perso':s.type)}</span>`:''}</button>`;
    }
    const s=data.shifts[selected],ws=workoutsFor(selected);
    shell(`<h2 class="page-title">Mon planning</h2><p class="muted tiny">Travail en équipes et entraînements</p><div class="btnline">${action('rotation','↻ Créer une rotation','primary')}${action('shift-add','+ Service','secondary')}</div>
      <div class="cal-head"><strong>${esc(monthName(month))}</strong><div class="navgroup"><button class="round" data-action="prev-month" aria-label="Mois précédent">‹</button><button class="round" data-action="next-month" aria-label="Mois suivant">›</button></div></div>
      <div class="calendar">${cells}</div><div class="legend"><span><i class="dot M"></i> Matin</span><span><i class="dot A"></i> Après-midi</span><span><i class="dot N"></i> Nuit</span><span><i class="dot R"></i> Repos</span><span><i class="dot workout"></i> Sport</span></div>
      <section class="card detail-card"><h3>${esc(prettyDate(selected))}</h3><div class="detail-row"><div><div class="tiletitle">💼 ${esc(shiftLabel(s))}</div>${s?.note?`<div class="tilemeta">${esc(s.note)}</div>`:''}</div><div class="btnline">${action(s?'shift-edit':'shift-add',s?'Modifier':'+ Service','small','data-date="'+selected+'"')}${s?action('shift-delete','✕','small danger','data-date="'+selected+'"'):''}</div></div>
      ${ws.map(w=>`<div class="detail-row"><div><div class="tiletitle">🏋️ ${esc(w.title)}</div><div class="tilemeta">${esc(w.time||'Heure libre')} · ${Number(w.duration)||0} min ${w.done?'· ✅':''}</div></div><div class="btnline">${action('sport-edit','Modifier','small','data-id="'+esc(w.id)+'"')}${action('sport-delete','✕','small danger','data-id="'+esc(w.id)+'"')}</div></div>`).join('')}
      <div style="margin-top:10px">${action('sport-add','+ Séance de sport','small secondary','data-date="'+selected+'"')}</div></section>`)
  }
  function renderSport(){
    const future=[...data.workouts].sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
    const done=data.workouts.filter(w=>w.done).length;
    shell(`<h2 class="page-title">Mon sport</h2><p class="muted tiny">Garde une trace de tes entraînements</p><div class="stats"><div class="stat"><strong>${data.workouts.length}</strong><small>Séances prévues</small></div><div class="stat"><strong>${done}</strong><small>Terminées</small></div><div class="stat"><strong>${data.workouts.reduce((a,w)=>a+(w.done?Number(w.duration)||0:0),0)}</strong><small>Minutes réalisées</small></div></div>
      <div class="section-head"><h2>Mes séances</h2>${action('sport-add','+ Ajouter','small primary')}</div>
      ${future.length?future.map(w=>`<div class="card workout-card"><div class="workout-top"><div><div class="tiny">${esc(prettyDate(w.date))}${w.time?' · '+esc(w.time):''}</div><div class="workout-name">${esc(w.title)}</div><div class="tilemeta">${esc(w.kind)} · ${Number(w.duration)||0} minutes</div></div><label class="checks"><input type="checkbox" data-action="sport-toggle" data-id="${esc(w.id)}" ${w.done?'checked':''} aria-label="Marquer ${esc(w.title)} comme terminée"> Terminée</label></div>${w.notes?`<div class="workout-notes">${esc(w.notes)}</div>`:''}<div class="btnline" style="margin-top:12px">${action('sport-edit','Modifier','small','data-id="'+esc(w.id)+'"')}${action('sport-delete','Supprimer','small danger','data-id="'+esc(w.id)+'"')}</div></div>`).join(''):empty('Aucune séance enregistrée. Ajoute une séance de musculation, cardio ou récupération.')}`)
  }
  function renderSettings(){shell(`<h2 class="page-title">Réglages</h2><p class="muted tiny">Tes données et tes préférences</p><div class="settings-list"><section class="card"><h3>🔁 Rotation d'équipes</h3><p>Tu peux créer automatiquement ton planning : matin, après-midi, nuit et repos. Modifie la suite selon ton vrai cycle.</p>${action('rotation','Configurer la rotation','primary')}</section><section class="card"><h3>💾 Mes données</h3><p>Les informations sont stockées uniquement dans le navigateur de cet appareil. Exporte une sauvegarde régulièrement, surtout avant de changer de téléphone.</p><div class="btnline">${action('export','Exporter la sauvegarde','secondary')}${action('import','Importer une sauvegarde','secondary')}</div><input id="import-file" type="file" accept="application/json,.json" hidden></section><section class="card"><h3>🛡️ Confidentialité</h3><p>Aucun compte, aucune synchronisation en ligne, aucun suivi publicitaire. Effacer les données du navigateur peut supprimer ton planning.</p>${action('reset','Tout effacer','danger')}</section><div class="notice">ℹ️ Cette première version ne propose pas encore de notifications automatiques, de synchronisation entre appareils ou de connexion à un calendrier externe.</div></div>`)}
  function render(){if(page==='home')renderHome();if(page==='planning')renderCalendar();if(page==='sport')renderSport();if(page==='settings')renderSettings()}
  const dialog=document.getElementById('dialog');
  const closeModal=()=>dialog.close();
  const modal=(title,contents)=>{document.getElementById('dialog-content').innerHTML=`<div class="modal-top"><h2>${title}</h2><button type="button" data-action="close" class="close" aria-label="Fermer">×</button></div>${contents}`;dialog.showModal()};
  function shiftModal(date=selected){const s=data.shifts[date]||{type:'M',start:TYPES.M.start,end:TYPES.M.end,note:''};modal(data.shifts[date]?'Modifier un service':'Ajouter un service',`<form id="shift-form"><div class="field"><label for="shift-date">Date</label><input id="shift-date" name="date" type="date" value="${esc(date)}" required></div><div class="field"><label for="shift-type">Type de journée</label><select id="shift-type" name="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${s.type===k?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div class="two-col"><div class="field"><label for="shift-start">Début</label><input id="shift-start" name="start" type="time" value="${esc(s.start||'')}" ${s.type==='R'?'disabled':''}></div><div class="field"><label for="shift-end">Fin</label><input id="shift-end" name="end" type="time" value="${esc(s.end||'')}" ${s.type==='R'?'disabled':''}></div></div><div class="helper">Un service de nuit peut se terminer le lendemain (ex. 22:00 → 06:00).</div><div class="field"><label for="shift-note">Note (facultatif)</label><input id="shift-note" name="note" maxlength="240" placeholder="Équipe B, rendez-vous…" value="${esc(s.note||'')}"></div><div class="modal-actions"><button type="button" class="button ghost" data-action="close">Annuler</button><button class="button primary" type="submit">Enregistrer</button></div></form>`);}
  function sportModal(id=null,date=selected){const w=id?data.workouts.find(x=>x.id===id):null;modal(w?'Modifier la séance':'Nouvelle séance',`<form id="sport-form"><input type="hidden" name="id" value="${esc(w?.id||'')}"><div class="field"><label for="sport-title">Nom de la séance</label><input id="sport-title" name="title" maxlength="70" required placeholder="Ex. Pectoraux / Triceps" value="${esc(w?.title||'')}"></div><div class="field"><label for="sport-kind">Type de sport</label><select id="sport-kind" name="kind">${['Musculation','Cardio','Course à pied','Football','Récupération','Autre'].map(x=>`<option ${w?.kind===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="two-col"><div class="field"><label for="sport-date">Date</label><input id="sport-date" name="date" type="date" required value="${esc(w?.date||date)}"></div><div class="field"><label for="sport-time">Heure (facultatif)</label><input id="sport-time" name="time" type="time" value="${esc(w?.time||'')}"></div></div><div class="field"><label for="sport-duration">Durée prévue (minutes)</label><input id="sport-duration" name="duration" type="number" min="1" max="1440" required value="${esc(w?.duration||60)}"></div><div class="field"><label for="sport-notes">Programme / notes</label><textarea id="sport-notes" name="notes" rows="4" maxlength="2000" placeholder="Développé couché : 4 × 10…">${esc(w?.notes||'')}</textarea></div><div class="modal-actions"><button type="button" class="button ghost" data-action="close">Annuler</button><button type="submit" class="button primary">Enregistrer</button></div></form>`);}
  function rotationModal(){modal('Créer une rotation',`<form id="rotation-form"><div class="notice">Exemple de cycle : <strong>M, M, A, A, N, N, R, R</strong> (2 matins, 2 après-midis, 2 nuits, 2 repos). C'est un exemple : adapte-le à ton entreprise.</div><div class="field"><label for="rotation-start">Premier jour du cycle</label><input id="rotation-start" name="start" type="date" required value="${keyToday}"></div><div class="field"><label for="rotation-pattern">Suite de journées</label><input id="rotation-pattern" name="pattern" required value="M,M,A,A,N,N,R,R" autocapitalize="characters" spellcheck="false"><span class="helper">M = Matin · A = Après-midi · N = Nuit · R = Repos. Sépare chaque jour par une virgule.</span></div><div class="field"><label for="rotation-days">Combien de jours générer ?</label><select id="rotation-days" name="days"><option value="28">28 jours</option><option value="56" selected>56 jours</option><option value="84">84 jours</option><option value="168">168 jours</option></select></div><label class="checks"><input type="checkbox" name="overwrite"> Remplacer les jours déjà enregistrés</label><p class="helper">Par défaut, les journées déjà saisies sont conservées.</p><div class="modal-actions"><button type="button" class="button ghost" data-action="close">Annuler</button><button type="submit" class="button primary">Générer le planning</button></div></form>`);}
  document.addEventListener('change',e=>{
    if(e.target.id==='shift-type'){const t=TYPES[e.target.value];if(!t)return;const start=document.getElementById('shift-start'),end=document.getElementById('shift-end');start.disabled=end.disabled=e.target.value==='R';start.value=t.start;end.value=t.end;}
    if(e.target.matches('[data-action="sport-toggle"]')){const w=data.workouts.find(w=>w.id===e.target.dataset.id);if(w){w.done=e.target.checked;save();render();}}
    if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;if(file.size>2*1024*1024){alert('Fichier trop volumineux (max. 2 Mo).');return;}file.text().then(raw=>{let v;try{v=JSON.parse(raw)}catch(e){alert('Le fichier JSON est invalide.');return;}if(!validData(v)||!Array.isArray(v.workouts)||v.workouts.length>20000){alert('Ce fichier ne correspond pas à une sauvegarde MyLife v1.');return;}if(!confirm('Remplacer ton planning actuel par cette sauvegarde ?'))return;data=v;save();render();alert('Sauvegarde importée.');}).catch(()=>alert('Impossible de lire ce fichier.'));}
  });
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b)return;
    const a=b.dataset.action,id=b.dataset.id,date=b.dataset.date;
    if(a==='nav'){page=b.dataset.page;render();window.scrollTo(0,0)}
    if(a==='prev-month'){month=new Date(month.getFullYear(),month.getMonth()-1,1);render()}
    if(a==='next-month'){month=new Date(month.getFullYear(),month.getMonth()+1,1);render()}
    if(a==='day'){selected=date;month=new Date(parseDate(date).getFullYear(),parseDate(date).getMonth(),1);render()}
    if(a==='shift-add'||a==='shift-edit')shiftModal(date||selected);
    if(a==='sport-add')sportModal(null,date||selected);
    if(a==='sport-edit')sportModal(id);
    if(a==='rotation')rotationModal();
    if(a==='close')closeModal();
    if(a==='shift-delete'&&confirm(`Supprimer le service du ${prettyDate(date)} ?`)){delete data.shifts[date];save();render()}
    if(a==='sport-delete'&&confirm('Supprimer cette séance ?')){data.workouts=data.workouts.filter(x=>x.id!==id);save();render()}
    if(a==='reset'&&confirm('Tout effacer ? Cette action est irréversible sans sauvegarde.')){data=defaults();save();selected=keyToday;page='home';render()}
    if(a==='export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=`MyLife-sauvegarde-${keyToday}.json`;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
    if(a==='import')document.getElementById('import-file')?.click();
  });
  document.addEventListener('submit',e=>{
    if(!['shift-form','sport-form','rotation-form'].includes(e.target.getAttribute('id')))return;
    e.preventDefault();const f=e.target,formId=f.getAttribute('id'),fd=new FormData(f);
    if(formId==='shift-form'){
      const date=fd.get('date'),type=fd.get('type');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!TYPES[type])return;
      const start=type==='R'?'':fd.get('start'),end=type==='R'?'':fd.get('end');if(type!=='R'&&(!start||!end)){alert('Renseigne les horaires de début et de fin.');return;}
      data.shifts[date]={type,start,end,note:String(fd.get('note')||'').slice(0,240)};selected=date;
    }
    if(formId==='sport-form'){
      const id=fd.get('id'),duration=Number(fd.get('duration')),date=fd.get('date');if(!Number.isInteger(duration)||duration<1||duration>1440){alert('Durée invalide.');return;}
      const existing=id?data.workouts.find(x=>x.id===id):null;
      const w={id:existing?.id||('w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)),title:String(fd.get('title')).trim().slice(0,70),kind:String(fd.get('kind')),date,time:String(fd.get('time')||''),duration,notes:String(fd.get('notes')||'').slice(0,2000),done:existing?.done||false};
      if(!w.title){alert('Donne un nom à la séance.');return;}if(existing)Object.assign(existing,w);else data.workouts.push(w);selected=date;
    }
    if(formId==='rotation-form'){
      const start=fd.get('start'),pattern=String(fd.get('pattern')||'').toUpperCase().replace(/\s/g,'').split(',');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||!pattern.length||pattern.length>100||pattern.some(x=>!['M','A','N','R'].includes(x))){alert('Cycle invalide. Utilise uniquement M, A, N et R séparés par des virgules.');return;}
      const n=Number(fd.get('days')),overwrite=fd.has('overwrite');let count=0;for(let i=0;i<n;i++){const k=dateKey(offsetDate(parseDate(start),i)),t=pattern[i%pattern.length];if(!data.shifts[k]||overwrite){data.shifts[k]={type:t,start:TYPES[t].start,end:TYPES[t].end,note:''};count++;}}
      selected=start;month=new Date(parseDate(start).getFullYear(),parseDate(start).getMonth(),1);page='planning';closeModal();save();render();alert(`${count} journée(s) de planning générée(s).`);return;
    }
    closeModal();save();render();
  });
  render();
  if('serviceWorker'in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script>
<!-- MyLife v2 : Sport maison et nutrition -->
<style>
#mlv2-open{
  position:fixed;bottom:90px;right:16px;z-index:30;
  border:0;border-radius:18px;padding:14px 19px;
  background:linear-gradient(120deg,#9a67ff,#653cce);
  color:white;font-weight:800;box-shadow:0 5px 25px #0009;
}
#mlv2-dialog{
  background:#11172a;color:white;border:1px solid #554777;
  border-radius:20px;width:min(94vw,520px);max-height:85vh;
  padding:20px;overflow:auto;
}
#mlv2-dialog::backdrop{background:#000b}

#mlv2-dialog .ml-card{
  padding:15px;margin:12px 0;background:#202841;
  border-radius:14px;
}
#mlv2-dialog .ml-btn{
  display:inline-block;padding:10px 13px;margin:5px 3px;
  background:#7754d8;border:0;border-radius:10px;
  color:white;text-decoration:none;font-weight:700;
}
#mlv2-dialog p{line-height:1.5;font-size:13px}
</style>

<button id="mlv2-open">💪 Sport & Repas</button>

<dialog id="mlv2-dialog">
  <button id="mlv2-close" class="ml-btn">✕ Fermer</button>
  <h2>MyLife v2 💜</h2>
  <button class="ml-btn" id="mlv2-sport">🏋️ Sport</button>
  <button class="ml-btn" id="mlv2-meals">🥗 Repas</button>
  <div id="mlv2-content"></div>
</dialog>

<script>
(() => {
  const dialog = document.getElementById('mlv2-dialog');
  const content = document.getElementById('mlv2-content');

  const exercises = [
    ['Pompes','3 × 6–12','pompes technique débutant'],
    ['Squats','3 × 12–20','squat poids du corps technique'],
    ['Fentes arrière','3 × 8–12 par jambe','fentes arrière technique'],
    ['Pont fessier','3 × 12–20','pont fessier exercice'],
    ['Gainage','3 × 20–40 secondes','gainage planche technique'],
    ['Pompes inclinées','3 × 8–15','pompes inclinées technique'],
    ['Superman','3 × 10–15','superman exercice dos']
  ];

  const meals = [
    {
      name:'Petit-déjeuner protéiné',
      ingredients:'200 g de skyr, 50 g de flocons d’avoine, une banane.',
      recipe:'Mélange le skyr et l’avoine, puis ajoute la banane.'
    },
    {
      name:'Poulet et riz',
      ingredients:'150 g de poulet, 75 g de riz cru, légumes.',
      recipe:'Fais cuire le riz, le poulet à cœur et les légumes.'
    },
    {
      name:'Omelette complète',
      ingredients:'3 œufs, pain complet, tomates.',
      recipe:'Prépare une omelette et accompagne-la de tartines.'
    },
    {
      name:'Saumon et pommes de terre',
      ingredients:'150 g de saumon, pommes de terre et haricots verts.',
      recipe:'Fais cuire les pommes de terre, les légumes et le saumon.'
    },
    {
      name:'Collation',
      ingredients:'200 g de fromage blanc, une pomme et des noix.',
      recipe:'Coupe la pomme et mélange le tout.'
    }
  ];

  function sport(){
    content.innerHTML = '<h2>Musculation à la maison</h2>'
      + '<p>Programme conseillé : 3 séances par semaine, avec récupération entre les séances difficiles.</p>'
      + exercises.map(e => `
        <div class="ml-card">
          <strong>${e[0]}</strong>
          <p>${e[1]}</p>
          <a class="ml-btn" target="_blank"
             rel="noopener noreferrer"
             href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[2])}">
             ▶ Voir des vidéos
          </a>
        </div>
      `).join('');
  }

  function nutrition(){
    content.innerHTML = '<h2>Mes recettes</h2>'
      + '<p>Des idées de repas pour accompagner ta prise de muscle. Adapte les portions à tes besoins.</p>'
      + meals.map(m => `
        <div class="ml-card">
          <strong>${m.name}</strong>
          <p><b>Ingrédients :</b> ${m.ingredients}</p>
          <p><b>Préparation :</b> ${m.recipe}</p>
        </div>
      `).join('');
  }

  document.getElementById('mlv2-open').onclick = () => {
    sport();
    dialog.showModal();
  };
  document.getElementById('mlv2-close').onclick = () => dialog.close();
  document.getElementById('mlv2-sport').onclick = sport;
  document.getElementById('mlv2-meals').onclick = nutrition;
})();
</script>
